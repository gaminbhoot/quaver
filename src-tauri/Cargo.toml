[package]
name = "quaver"
version = "0.1.0"
description = "Quaver FLAC/ALAC Native Music Player"
authors = ["gaminbhoot"]
edition = "2021"

[lib]
name = "quaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
base64 = "0.22"
walkdir = "2"
