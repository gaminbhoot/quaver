[package]
name = "quaver"
version = "0.1.0"
description = "Quaver FLAC/ALAC Native Music Player"
authors = ["gaminbhoot"]
edition = "2021"

[lib]
name = "quaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
base64 = "0.22"
walkdir = "2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString", "NSThread", "NSData"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSControl",
    "NSButton",
    "NSTextField",
    "NSSearchField",
    "NSSlider",
    "NSFont",
    "NSColor",
    "NSGlassEffectView",
    "NSImage",
    "NSImageView",
    "objc2-core-foundation",
] }
