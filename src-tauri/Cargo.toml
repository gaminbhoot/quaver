[package]
name = "quaver"
version = "0.1.0"
description = "Native macOS FLAC / ALAC music player with synced lyrics."
authors = ["Quaver"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "quaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.24"
walkdir = "2.5"
base64 = "0.22"
thiserror = "1"
dirs = "5"
