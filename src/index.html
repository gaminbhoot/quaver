<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quaver</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Main App Container simulating native macOS window -->
    <div class="mac-window">
      <!-- Titlebar / Top Navigation Header -->
      <div class="window-titlebar" id="titlebar">
        <div class="titlebar-spacer" data-tauri-drag-region></div>
        <div class="top-nav-controls">
          <button id="import-folder-btn" class="btn-primary-mac">
            <svg class="icon-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Add Music Folder
          </button>
          <input type="file" id="fallback-folder-input" webkitdirectory directory multiple style="display: none;" />
        </div>
      </div>

      <!-- Main Layout Split -->
      <div class="window-content">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-header">Library</div>
            <a href="#" class="sidebar-item active" id="sidebar-tracks">
              <svg class="icon-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              All Songs
            </a>
            <a href="#" class="sidebar-item" id="sidebar-nowplaying">
              <svg class="icon-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm0 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm-2 4.5l6 3.5-6 3.5v-7z"/></svg>
              Now Playing
            </a>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-view" id="main-view">
          <div class="view-pane active" id="pane-tracks">
            <h1 class="view-title">All Songs</h1>
            <div class="table-container">
              <table class="tracks-table">
                <thead>
                  <tr>
                    <th class="col-num">#</th>
                    <th class="col-title">Title</th>
                    <th class="col-album">Album</th>
                    <th class="col-type">Format</th>
                    <th class="col-duration">Duration</th>
                  </tr>
                </thead>
                <tbody id="tracks-list-body">
                  <tr class="empty-state">
                    <td colspan="5" style="text-align: center; padding: 5rem 1rem;">
                      <div class="empty-icon">📁</div>
                      <h3>No music loaded yet</h3>
                      <p>Select your FLAC/ALAC library folder from your local disk or external hard drive.</p>
                      <div style="display: flex; justify-content: center; margin-top: 16px;">
                        <button id="empty-add-folder-btn" class="btn-primary-mac" style="padding: 10px 20px; font-size: 14px;">
                          <svg class="icon-svg" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                          Select Music Folder
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Player Bar -->
      <div class="mini-player">
        <div class="player-left">
          <div class="now-playing-cover" id="mini-cover"></div>
          <div class="now-playing-meta">
            <div class="track-title" id="mini-title">Not Playing</div>
            <div class="track-artist" id="mini-artist">-</div>
          </div>
        </div>
        <div class="player-center">
          <div class="player-buttons">
            <button class="btn-icon" id="btn-shuffle" title="Shuffle">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button class="btn-icon" id="btn-prev" title="Previous">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="btn-icon btn-playpause" id="btn-play" title="Play">
              <svg viewBox="0 0 24 24" id="play-icon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-icon" id="btn-next" title="Next">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="btn-icon" id="btn-repeat" title="Repeat">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
          </div>
          <div class="progress-container">
            <span class="time-elapsed" id="time-elapsed">0:00</span>
            <div class="progress-bar-wrapper" id="progress-bar-wrapper">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="time-total" id="time-total">0:00</span>
          </div>
        </div>
        <div class="player-right">
          <button class="btn-icon" id="btn-lyrics-toggle" title="Show Lyrics">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          </button>
          <div class="volume-container">
            <svg class="icon-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <div class="volume-bar-wrapper" id="volume-bar-wrapper">
              <div class="volume-bar" id="volume-bar" style="width: 80%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Fullscreen Synced Lyrics View (Monochrome Design) -->
      <div class="fullscreen-overlay" id="fullscreen-overlay">
        <div class="fullscreen-bg" id="fullscreen-bg"></div>
        <div class="fullscreen-bg-overlay"></div>

        <div class="fullscreen-header">
          <div class="fullscreen-window-title" data-tauri-drag-region id="fs-window-title">Quaver Music - Not Playing</div>
          <div class="fullscreen-controls">
            <button class="btn-icon btn-close-fs" id="btn-close-fs" title="Exit Fullscreen">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <div class="fullscreen-main-view">
          <div class="fullscreen-media-column">
            <div class="fullscreen-artwork-card">
              <div id="fullscreen-cover-image"></div>
            </div>
            
            <div class="fullscreen-track-info">
              <h2 id="fullscreen-track-title">Not Playing</h2>
              <div id="fullscreen-track-artist">-</div>
            </div>

            <div class="fs-progress-container">
              <span class="fs-time" id="fs-time-elapsed">0:00</span>
              <div class="fs-progress-bar-wrapper" id="fs-progress-bar-wrapper">
                <div class="fs-progress-bar" id="fs-progress-bar"></div>
              </div>
              <span class="fs-time" id="fs-time-total">0:00</span>
            </div>

            <div class="fs-playback-controls">
              <button class="btn-icon fs-btn" id="fs-btn-shuffle" title="Shuffle">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
              </button>
              <button class="btn-icon fs-btn" id="fs-btn-prev" title="Previous">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="btn-icon fs-btn-playpause" id="fs-btn-play" title="Play">
                <svg viewBox="0 0 24 24" id="fs-play-icon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="btn-icon fs-btn" id="fs-btn-next" title="Next">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
              <button class="btn-icon fs-btn" id="fs-btn-repeat" title="Repeat">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
              </button>
            </div>

            <div class="fs-volume-container">
              <svg viewBox="0 0 24 24" style="width: 18px; opacity: 0.6;"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <div class="fs-volume-bar-wrapper" id="fs-volume-bar-wrapper">
                <div class="fs-volume-bar" id="fs-volume-bar" style="width: 80%;"></div>
              </div>
            </div>
          </div>

          <div class="fullscreen-lyrics-pane">
            <div class="fullscreen-lyrics-content" id="fullscreen-lyrics-container">
              <div class="synced-lyrics-list" id="synced-lyrics-list">
                <div class="lyrics-placeholder">No lyrics available</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
